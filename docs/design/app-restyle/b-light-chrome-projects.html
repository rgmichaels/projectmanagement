<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>projects - b-light-chrome</title>
<style>
/* Proposed :root for public/css/app.css (tokens promoted from dialog#detail). */
:root{
  --teal:#0b5d66; --teal-mid:#65999e; --teal-soft:#e5eded; --page:#f8fafa;
  --navy:#154973; --linkblue:#004dd1; --gold:#face00; --ink:#000;
  --muted:#62666a; --line:#d0d0ce; --line2:#e4e4e4; --danger:#c0300b; --neutral:#62666a;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  /* legacy names the existing rules read, re-pointed */
  --bg:var(--page); --surface:#fff; --column:var(--teal-soft); --border:var(--line);
  --text:var(--ink); --primary:var(--teal);
  font-family:"Proxima Nova","Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:14px;color:var(--ink);background:var(--page);
}
*{box-sizing:border-box} body{margin:0;background:var(--page)}
h1{font-size:20px;margin:0;color:var(--teal);font-weight:700}
h2{font-size:16px;margin:0 0 12px;color:var(--teal);font-weight:700}
a{color:var(--linkblue)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
button{border:1px solid var(--navy);color:var(--navy);background:#fff;border-radius:4px;padding:6px 12px;font-weight:700;cursor:pointer}
button.primary{background:var(--teal);border-color:var(--teal);color:#fff}
button.navy{background:var(--navy);border-color:var(--navy);color:#fff}
button.danger{color:var(--danger);border-color:var(--line)}
button[disabled]{opacity:.6;cursor:default}
button.link{border:none;background:none;padding:0;color:var(--linkblue);font-size:12px;font-weight:400;text-decoration:underline;text-underline-offset:2px}
input,select,textarea{padding:6px 8px;border:1px solid var(--navy);border-radius:4px;background:#fff}
label{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;color:var(--ink);font-size:12px;font-weight:700}
label.toggle,label.group-by,label.filter{flex-direction:row;align-items:center;gap:6px;margin:0;font-size:13px;font-weight:700}
.page{padding:20px;max-width:1400px;margin:0 auto}
.toolbar{display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.toolbar h1{margin-right:auto}
.board-page .toolbar h1{margin-right:0}
.board-page .toolbar .group-by{margin-left:auto}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.form-row{display:flex;gap:12px;flex-wrap:wrap}
.actions{display:flex;gap:8px}
.error{color:var(--danger);min-height:1em;margin:4px 0}
.hint{color:var(--muted);font-size:12px}
.empty{text-align:center;padding:40px;background:#fff;border:1px dashed var(--teal-mid);border-radius:8px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;background:var(--teal-soft);color:var(--ink);font-size:11px;font-weight:700;text-transform:uppercase;border:1px solid var(--teal-mid)}
.badge.archived{background:#fff0b3;border-color:#c9a800}
table.projects{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
table.projects th{background:var(--teal-soft);color:var(--teal);font-size:12px;font-weight:700;text-align:left;padding:9px 12px;border-bottom:1px solid var(--teal-mid)}
table.projects td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line2)}
table.projects tr:last-child td{border-bottom:none}
table.projects tbody tr:hover td{background:var(--page)}
table.projects tr.is-archived td{color:var(--muted);background:var(--page)}
.row-actions{text-align:right} .row-actions button{margin-left:6px}
.filter-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;flex-basis:100%;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
label.filter input[type=search]{width:220px;max-width:100%}
.filter-count{color:var(--muted);font-size:13px}
.notice{display:flex;align-items:center;gap:12px;background:var(--teal-soft);border:1px solid var(--teal-mid);padding:8px 12px;border-radius:4px;margin-bottom:12px}
.message{background:#fff;border:1px solid var(--danger);border-left-width:4px;color:var(--danger);padding:8px 12px;border-radius:4px;margin-bottom:12px;font-weight:700}
.board{overflow-x:auto}
.board-header,.lane-body{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:8px}
.col-header{display:flex;justify-content:space-between;padding:8px 10px;font-size:12px;font-weight:700;text-transform:uppercase;color:var(--teal)}
.count{color:var(--muted);font-weight:400}
.lane{margin-top:8px}
.lane-header{display:flex;gap:8px;align-items:center;width:100%;border:none;background:transparent;padding:6px 4px;color:var(--teal);font-weight:700;text-align:left}
.lane-header .count{font-size:12px}
.column{padding:6px;min-height:60px;display:flex;flex-direction:column;gap:6px}
.card{--type-color:var(--neutral);background:#fff;border:1px solid var(--line);border-left:4px solid var(--type-color);border-radius:4px;box-shadow:0 1px 2px rgba(9,30,40,.12);padding:8px 10px;cursor:grab}
.card:hover{border-color:var(--teal-mid);border-left-color:var(--type-color)}
.card-title{margin-bottom:8px;word-break:break-word}
.card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.card-key{font-weight:700;font-family:var(--mono);color:var(--ink)}
.type-badge{--type-color:var(--neutral);display:inline-flex;align-items:center;gap:5px;padding:1px 6px;border-radius:4px;background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:600;font-size:11px}
.type-badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--type-color)}
.epic-chip{background:#eae6ff;color:#403294;padding:1px 6px;border-radius:4px;font-weight:700}
.resolution-label{padding:1px 6px;border-radius:4px;background:#2f6b3f;color:#fff;font-weight:700;font-size:11px}
.priority{border:1px solid var(--line);padding:0 5px;border-radius:4px}
.avatar{margin-left:auto;width:24px;height:24px;border-radius:50%;background:var(--teal);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.avatar.unassigned{background:var(--muted)}
.drop-indicator{height:4px;border-radius:2px;background:var(--navy)}
.login{max-width:420px;margin:40px auto}
.user-list{border:none;padding:0;margin:0 0 8px}
.user-list legend{color:var(--ink);font-weight:700;font-size:12px;margin-bottom:6px}
label.user-option{flex-direction:row;align-items:center;gap:8px;font-size:14px;font-weight:400;margin:0;padding:8px;border-radius:4px;cursor:pointer}
label.user-option:hover{background:var(--teal-soft)}
.user-username{color:var(--muted);font-size:12px}
.mock-note{font:12px var(--mono);color:var(--muted);padding:6px 20px;background:#fff;border-bottom:1px solid var(--line2)}
/* OPTION B: light chrome, teal only as accent */
.topbar{background:#fff;color:var(--teal);padding:10px 20px;display:flex;gap:10px;align-items:center;border-bottom:3px solid var(--teal)}
.topbar .brand{color:var(--teal);font-weight:700;text-decoration:none;font-size:15px}
.topbar .crumb{color:var(--muted)}
.topbar .nav-link{color:var(--linkblue);font-weight:700}
.topbar .session{margin-left:auto;display:flex;align-items:center;gap:12px;color:var(--ink)}
.topbar .session button{padding:3px 10px}
.column{background:#fff;border:1px solid var(--line);border-radius:8px}
.col-header{background:var(--teal-soft);border-radius:8px;margin-bottom:6px}
.login h1{margin-bottom:12px}
</style></head><body>
<div class="mock-note">Mockup b-light-chrome / projects (static, no network)</div>
<header class="topbar">
  <a class="brand" href="#">Projects</a>
  <span class="session"><a class="nav-link" href="#">Users</a><span>Dana Reyes</span><button type="button">Sign out</button></span>
</header>
<main class="page">
  <section class="toolbar">
    <h1>Projects</h1>
    <label class="toggle"><input type="checkbox"> Show archived</label>
    <button type="button" class="primary">Create project</button>
  </section>
  <form class="panel" novalidate>
    <h2>Create project</h2>
    <div class="form-row">
      <label>Name <input value="Gemini" maxlength="80"></label>
      <label>Key <input placeholder="PROJ" maxlength="10"></label>
      <label>Status <select><option>Planning</option></select></label>
    </div>
    <p class="error" role="alert">Key is required.</p>
    <div class="actions"><button type="button" class="primary">Create</button><button type="button">Cancel</button></div>
  </form>
  <table class="projects">
    <thead><tr><th>Name</th><th>Key</th><th>Status</th><th></th></tr></thead>
    <tbody>
      <tr><td><a href="#">Apollo</a></td><td>APO</td><td><span class="badge">In Progress</span></td><td class="row-actions"><button type="button">Edit</button><button type="button">Archive</button></td></tr>
      <tr><td><a href="#">Mercury &lt;b&gt;shown literally&lt;/b&gt;</a></td><td>MER</td><td><span class="badge">Planning</span></td><td class="row-actions"><button type="button">Edit</button><button type="button">Archive</button></td></tr>
      <tr class="is-archived"><td><a href="#">Vostok</a> <span class="badge archived">Archived</span></td><td>VOS</td><td><span class="badge">Completed</span></td><td class="row-actions"><button type="button">Unarchive</button></td></tr>
    </tbody>
  </table>
  <p style="margin-top:24px" class="hint">Empty state:</p>
  <div class="empty"><p>No projects yet.</p><button type="button" class="primary">Create project</button></div>
</main>
</body></html>
