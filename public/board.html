<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Board</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Projects</a>
    <span class="crumb" id="crumb"></span>
  </header>

  <main class="page board-page">
    <section class="toolbar">
      <h1 id="project-title">Board</h1>
      <span class="badge" id="project-status"></span>
      <span class="badge archived" id="archived-badge" hidden>Archived (read-only)</span>
      <label class="group-by">Group by <select id="group-by"></select></label>
      <button type="button" id="create-item" class="primary" hidden>Create work item</button>
    </section>

    <div id="message" class="message" role="alert" hidden></div>

    <div id="board" class="board"></div>
  </main>

  <dialog id="detail">
    <form id="detail-form" method="dialog" novalidate>
      <h2 id="detail-title">Work item</h2>
      <label>Title <input name="title" maxlength="200" required></label>
      <div class="form-row">
        <label>Type <select name="type"></select></label>
        <label id="status-field">Status <select name="status"></select></label>
        <label>Priority <select name="priority"></select></label>
      </div>
      <div class="form-row">
        <label id="resolution-field" hidden>Resolution <select name="resolution"></select></label>
      </div>
      <div class="form-row">
        <label>Assignee <select name="assignee_id"></select></label>
        <!-- The epic dropdown, plus a link that opens the saved epic. -->
        <div id="epic-field" class="epic-field">
          <label><span id="epic-label"></span> <select name="epic_id"></select></label>
          <button type="button" id="epic-open" class="link epic-open" hidden></button>
        </div>
      </div>
      <!-- Description: for a saved work item a read view (plain text with image
           tokens shown as images, js/richText.js) and Edit; the edit view is a
           plain textarea showing the raw text. Pasting an image uploads it as
           an attachment and inserts its token. -->
      <div class="description-field">
        <div class="field-head">
          <label for="description-input">Description</label>
          <button type="button" id="description-edit" class="link" hidden>Edit</button>
        </div>
        <div id="description-view" class="description-view" hidden></div>
        <textarea id="description-input" name="description" rows="5"></textarea>
        <p class="paste-note" id="description-note" role="status" hidden></p>
        <div id="description-images" class="image-strip" hidden>
          <span class="image-strip-label">Images in this description</span>
          <div id="description-thumbs" class="image-strip-thumbs"></div>
        </div>
      </div>
      <p class="reporter" id="reporter" hidden></p>
      <!-- Epic view: shown only when the open work item is an epic type. Not
           part of the work item's Save: add and remove use the child's PATCH,
           and buttons are type="button" so they never submit the
           method="dialog" form. Status names come from the server. The Add,
           Remove and Create child controls are hidden when archived. -->
      <section id="epic-view" class="epic-view" hidden>
        <h3 id="epic-view-heading"></h3>
        <p class="error" id="epic-view-error" role="alert"></p>
        <div class="epic-progress">
          <div class="progress-bar" id="epic-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-label="Progress">
            <div class="progress-fill" id="epic-progress-fill"></div>
          </div>
          <span class="progress-text" id="epic-progress-text"></span>
        </div>
        <ul id="epic-counts" class="epic-counts"></ul>
        <p class="epic-empty" id="epic-empty" hidden></p>
        <ul id="epic-children" class="epic-children"></ul>
        <div id="epic-actions" class="epic-actions">
          <select id="epic-add-target" aria-label="Existing work item to add"></select>
          <button type="button" id="epic-add">Add</button>
          <button type="button" id="epic-create-child">Create child</button>
        </div>
        <p class="error" id="epic-add-error" role="alert"></p>
      </section>
      <!-- Links: not part of the work item's Save. Relationships come from
           GET /api/link-types; buttons are type="button" so they never submit
           the method="dialog" form. Add and Remove are hidden when archived. -->
      <section id="links" class="links" hidden>
        <h3>Links</h3>
        <p class="links-empty" id="links-empty" hidden>No links.</p>
        <div id="links-list" class="links-list"></div>
        <div id="link-form" class="link-form">
          <select id="link-relation" aria-label="Relationship"></select>
          <select id="link-target" aria-label="Work item to link"></select>
          <button type="button" id="link-add">Add link</button>
        </div>
        <p class="error" id="link-error" role="alert"></p>
      </section>
      <!-- Attachments: not part of the work item's Save. Allowed types and
           limits come from GET /api/attachment-types; buttons are type="button"
           so they never submit the method="dialog" form. Add and Delete are
           hidden when archived; a new work item must be saved first. -->
      <section id="attachments" class="attachments" hidden>
        <h3 id="attachments-heading">Attachments (0)</h3>
        <p class="attachments-note" id="attachments-note" hidden>Save the work item first.</p>
        <div id="attachment-controls" class="attachment-controls">
          <button type="button" id="attachment-add">Add files</button>
          <input type="file" id="attachment-input" multiple hidden aria-label="Files to attach">
          <span class="hint">or drop files here</span>
        </div>
        <p class="error attachment-error" id="attachment-error" role="alert"></p>
        <p class="attachments-empty" id="attachments-empty" hidden>No attachments.</p>
        <ul id="attachment-list" class="attachment-list"></ul>
      </section>
      <!-- Discussion and History tabs: not part of the work item's Save. Their
           buttons are type="button" so they never submit the method="dialog" form. -->
      <div id="activity-tabs" class="tabs" role="tablist" aria-label="Activity" hidden>
        <button type="button" role="tab" id="tab-discussion" class="tab" aria-controls="discussion" aria-selected="true">Discussion</button>
        <button type="button" role="tab" id="tab-history" class="tab" aria-controls="history" aria-selected="false">History</button>
      </div>
      <section id="discussion" class="discussion" role="tabpanel" aria-labelledby="tab-discussion" hidden>
        <h3 id="discussion-heading">Discussion (0)</h3>
        <div id="comment-form" class="comment-form">
          <p class="posting-as" id="posting-as"></p>
          <textarea id="comment-body" rows="3" placeholder="Write a message" aria-label="Message"></textarea>
          <p class="paste-note" id="comment-note" role="status" hidden></p>
          <p class="error" id="comment-error" role="alert"></p>
          <div class="actions"><button type="button" id="comment-post" class="primary">Post</button></div>
        </div>
        <p class="thread-empty" id="thread-empty" hidden>No messages yet. Be the first to post.</p>
        <ul id="thread" class="thread"></ul>
      </section>
      <!-- History: read-only, newest first; also readable on archived projects. -->
      <section id="history" class="history" role="tabpanel" aria-labelledby="tab-history" hidden>
        <div class="history-toolbar">
          <label class="history-filter">Show <select id="history-field" aria-label="Filter history by field"><option value="">All fields</option></select></label>
        </div>
        <p class="history-note" id="history-note" hidden></p>
        <div class="history-error" id="history-error" hidden>
          <p class="error" id="history-error-text" role="alert"></p>
          <button type="button" id="history-retry">Retry</button>
        </div>
        <ul id="history-list" class="history-list"></ul>
        <div class="actions"><button type="button" id="history-more" hidden>Show more</button></div>
      </section>
      <p class="error" id="detail-error" role="alert"></p>
      <div class="actions">
        <button type="submit" value="save" id="detail-save" class="primary">Save</button>
        <button type="button" id="detail-delete" class="danger">Delete</button>
        <button type="button" id="detail-close">Close</button>
      </div>
    </form>
  </dialog>

  <script src="js/redirect.js"></script>
  <script src="js/api.js"></script>
  <script src="js/session.js"></script>
  <script src="js/time.js"></script>
  <script src="js/historyFormat.js"></script>
  <script src="js/richText.js"></script>
  <script src="js/board.js"></script>
</body>
</html>
