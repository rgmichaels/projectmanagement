<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">Projects</span>
  </header>

  <main class="page">
    <form id="login-form" class="panel login" novalidate>
      <h1>Sign in</h1>
      <fieldset id="user-list" class="user-list">
        <legend>Choose your username</legend>
      </fieldset>
      <p class="error" id="login-error" role="alert"></p>
      <div class="actions">
        <button type="submit" id="login-submit" class="primary" disabled>Sign in</button>
      </div>
      <p class="hint">Proof-of-concept sign-in without a password: anyone can sign in as any user. Do not use with real data.</p>
    </form>
  </main>

  <script src="js/redirect.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
